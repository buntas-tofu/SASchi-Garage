name: Garage checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog, validator tests and artifact style
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Garage
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check catalog
        run: python3 tools/check_catalog.py
      - name: Run validator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check artifact style
        run: python3 tools/check_artifact_style.py
